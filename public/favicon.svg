      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#panelGrad)" />
  <circle cx="24" cy="24" r="18" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5" />
  <!-- Solar panel grid -->
  <polygon points="12,32 36,32 38,20 10,20" fill="none" stroke="url(#solarGrad)" stroke-width="2" stroke-linejoin="round" />
  <line x1="24" y1="20" x2="24" y2="32" stroke="url(#solarGrad)" stroke-width="1.5" />
