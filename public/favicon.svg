  <line x1="31" y1="20" x2="32" y2="32" stroke="url(#solarGrad)" stroke-width="1.2" />
  <line x1="11" y1="26" x2="37" y2="26" stroke="url(#solarGrad)" stroke-width="1.2" />
  <!-- Sun rising -->
  <circle cx="24" cy="14" r="5" fill="url(#solarGrad)" />
  <path d="M24,6 L24,8 M17,9 L18.5,10.5 M31,9 L29.5,10.5 M14,14 L16,14 M34,14 L32,14" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" />
